[project]
name = "bank"
version = "0.1.0"
description = "A strictly typed SQLite banking CLI for a college DBMS project"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Ravencentric", email = "78981416+Ravencentric@users.noreply.github.com" }]
dependencies = []

[project.scripts]
bank = "bank:main"

[dependency-groups]
dev = [
  "pyrefly>=1.3.2",
  "ruff>=0.16.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pyrefly]
project-includes = [
  "**/*.py*",
  "**/*.ipynb",
]
preset = "strict"

